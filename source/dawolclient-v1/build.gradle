plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java'
}

version = '1.3.0'
group = 'dev.gtrace'

base {
    archivesName = 'dawolclient'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    // 26.x is unobfuscated: plain implementation/compileOnly, no modImplementation.
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Loom no longer remaps; the standard jar task is the deliverable.
jar {
    archiveFileName = 'dawol.client.v1.3.jar'
    manifest {
        attributes(
            'Implementation-Title'  : 'DawolClient',
            'Implementation-Version': project.version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
